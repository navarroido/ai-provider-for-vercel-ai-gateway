name: Deploy to WordPress Plugin Repository

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Subversion
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion rsync

      - name: Set variables
        run: |
          set -euo pipefail

          PLUGIN_SLUG="ai-provider-for-vercel-ai-gateway"
          MAIN_FILE="ai-provider-for-vercel-ai-gateway.php"

          if [ ! -f "$MAIN_FILE" ]; then
            echo "Main plugin file not found at: $PWD/$MAIN_FILE"
            exit 1
          fi

          VERSION=$(grep -Eim1 '^[[:space:]]*\*?[[:space:]]*Version:[[:space:]]*' "$MAIN_FILE" \
            | sed -E 's/.*Version:[[:space:]]*([^[:space:]]+).*/\1/' \
            | tr -d '\r')

          if [ -z "$VERSION" ]; then
            echo "Could not determine version from $MAIN_FILE"
            exit 1
          fi

          echo "PLUGIN_SLUG=$PLUGIN_SLUG" >> "$GITHUB_ENV"
          echo "MAIN_FILE=$MAIN_FILE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Determined plugin version: $VERSION"

      - name: Deploy to WordPress SVN
        env:
          SVN_USERNAME: ${{ secrets.WP_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_SVN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${SVN_USERNAME:-}" ] || [ -z "${SVN_PASSWORD:-}" ]; then
            echo "Missing SVN credentials. Add WP_SVN_USERNAME and WP_SVN_PASSWORD repository secrets."
            exit 1
          fi

          PLUGIN_SLUG="${{ env.PLUGIN_SLUG }}"
          VERSION="${{ env.VERSION }}"
          SVN_URL="https://plugins.svn.wordpress.org/$PLUGIN_SLUG"
          SVN_DIR="$PLUGIN_SLUG-svn"
          WP_ASSETS_STAGING="wp-org-assets"

          echo "SVN URL: $SVN_URL"
          echo "SVN checkout dir: $SVN_DIR"
          echo "Plugin version: $VERSION"

          svn checkout \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            "$SVN_URL" \
            "$SVN_DIR" \
            --non-interactive \
            --trust-server-cert

          mkdir -p "$SVN_DIR/trunk" "$SVN_DIR/assets" "$SVN_DIR/tags"

          rm -rf "$WP_ASSETS_STAGING"
          mkdir -p "$WP_ASSETS_STAGING"
          ASSETS_FOUND=0

          # Preferred place for WordPress.org directory assets.
          # The plugin's own assets/ directory is intentionally kept in trunk.
          if [ -d ".wordpress-org" ]; then
            rsync -rc --delete ".wordpress-org/" "$WP_ASSETS_STAGING/"
            ASSETS_FOUND=1
          fi

          # Also support WordPress.org asset files kept in the repository root.
          for file in banner-*.* icon-*.* screenshot-*.*; do
            if [ -f "$file" ]; then
              cp "$file" "$WP_ASSETS_STAGING/"
              ASSETS_FOUND=1
            fi
          done

          if [ "$ASSETS_FOUND" -eq 1 ]; then
            rsync -rc --delete "$WP_ASSETS_STAGING/" "$SVN_DIR/assets/"
          else
            echo "No WordPress.org assets found. Leaving existing SVN assets unchanged."
          fi

          rsync -rc --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".gitignore" \
            --exclude=".distignore" \
            --exclude=".DS_Store" \
            --exclude=".wordpress-org" \
            --exclude="node_modules" \
            --exclude="vendor/" \
            --exclude="composer.json" \
            --exclude="composer.lock" \
            --exclude="tests/" \
            --exclude="*.map" \
            --exclude="*.zip" \
            --exclude="$SVN_DIR" \
            --exclude="$WP_ASSETS_STAGING" \
            --exclude="banner-*.*" \
            --exclude="icon-*.*" \
            --exclude="screenshot-*.*" \
            ./ "$SVN_DIR/trunk/"

          if svn ls "$SVN_URL/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists. Updating trunk/assets and tagged readme only; no new tag will be created."
            cp "$SVN_DIR/trunk/readme.txt" "$SVN_DIR/tags/$VERSION/readme.txt"
          else
            echo "Creating SVN tag for version $VERSION."
            svn cp "$SVN_DIR/trunk" "$SVN_DIR/tags/$VERSION"
          fi

          cd "$SVN_DIR"

          DELETES=$(svn status | awk '/^!/ {print $2}')
          if [ -n "$DELETES" ]; then
            echo "$DELETES" | xargs -r svn delete
          fi

          ADDS=$(svn status | awk '/^\?/ {print $2}')
          if [ -n "$ADDS" ]; then
            echo "$ADDS" | xargs -r svn add
          fi

          if [ -z "$(svn status)" ]; then
            echo "No SVN changes to commit."
            exit 0
          fi

          svn commit -m "Deploy version $VERSION" \
            --username "$SVN_USERNAME" \
            --password "$SVN_PASSWORD" \
            --non-interactive \
            --trust-server-cert
